<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>3D Pathfinding Playground</title>

  <link rel="stylesheet" href="style.css">

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
    <div id="app">
        <aside id="toolbar">
            <h1>3D Pathfinding Playground</h1>

            <p class="subtitle">
            Build obstacles and compare pathfinding and simple game-AI behaviors.
            </p>

            <section class="section">
            <h2 class="section-title">Editing tool</h2>

            <div class="tool-grid">
                <button class="tool active" data-tool="wall">
                Toggle wall
                </button>

                <button class="tool" data-tool="erase">
                Erase wall
                </button>

                <button class="tool" data-tool="start">
                Place start
                </button>

                <button class="tool" data-tool="goal">
                Place goal
                </button>
            </div>
            </section>

            <section class="section">
            <label for="algorithm">Pathfinding algorithm</label>

            <select id="algorithm">
                <option value="astar">A* Search</option>
                <option value="dijkstra">Dijkstra</option>
                <option value="bfs">Breadth-First Search</option>
                <option value="greedy">Greedy Best-First</option>
            </select>
            </section>

            <section class="section">
            <label for="behavior">Game-AI behavior</label>

            <select id="behavior">
                <option value="goal">Move to goal</option>
                <option value="patrol">Patrol between start and goal</option>
                <option value="wander">Wander to random tiles</option>
            </select>
            </section>

            <section class="section">
            <label for="speed">Animation speed</label>

            <div class="range-row">
                <input
                id="speed"
                type="range"
                min="1"
                max="100"
                value="75"
                >

                <span id="speedValue">75%</span>
            </div>
            </section>

            <section class="section button-grid">
            <button id="run" class="primary">Run AI</button>
            <button id="stop" class="danger">Stop</button>
            <button id="random">Random walls</button>
            <button id="clear">Clear board</button>
            </section>

            <div id="status" aria-live="polite">
            Select a tool, then click a tile.
            </div>

            <div class="legend">
            <div class="legend-item">
                <span class="swatch start-color"></span>
                Start
            </div>

            <div class="legend-item">
                <span class="swatch goal-color"></span>
                Goal
            </div>

            <div class="legend-item">
                <span class="swatch explored-color"></span>
                Explored
            </div>

            <div class="legend-item">
                <span class="swatch path-color"></span>
                Final path
            </div>
            </div>

            <p class="instructions">
            Left-click a tile to edit it. Drag to rotate the camera.
            Use the mouse wheel to zoom and right-drag to pan.
            </p>
        </aside>

        <main id="viewport" aria-label="3D pathfinding grid"></main>
    </div>

  <script type="module" src="script.js"></script>
</body>
</html>
